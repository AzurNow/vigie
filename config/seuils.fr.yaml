# Seuils réglementaires — France
# TOUTES LES VALEURS SONT INDICATIVES ET À VÉRIFIER sur les sources officielles
# (code de la commande publique, avis publiés au JORF pour les seuils européens, DAJ/economie.gouv.fr)
# avant tout usage. Une règle ne lit jamais un seuil ailleurs qu'ici.
#
# Chaque seuil est daté : les règles prennent la valeur en vigueur à la date de notification du marché.
# Montants en euros HT.

