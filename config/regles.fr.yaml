# Paramètres des règles — France
# Valeurs de départ, à calibrer avec les retours (voir 02-specification-metier.md §4.5).
# Les percentiles s'entendent au sein de la strate de l'institution, sur la période de référence nationale.

version: 0.1.0
catalogue: 0.1.0

defaut:
  periode_reference_mois: 36      # fenêtre d'analyse par défaut
  min_marches_pour_agregat: 5     # en dessous, les règles agrégées ne se déclenchent pas (confiance insuffisante)

regles:
  A1:
    percentile_strate: 80
    min_marches: 5
  A2:
    percentile_strate: 10
  A3:
    percentile_strate: 80
  A4:
    min: 3
  B1:
    bande: 0.05                   # 5 % sous le seuil
    sévérite_si_n_marches_dans_bande: {2: moyenne, 4: forte}
  B2:
    fenetre_mois: 12
    cpv_niveau: 3                 # 3 premiers chiffres du CPV = groupe
  B3:
    percentile_strate: 90
  C1:
    percentile_strate: 85
    min: 4
  C2:
    part: 0.40
    min_montant: 100000
  C3:
    n: 3
  C4:
    part: 0.30
  D1:
    part: 0.15
    forte_si_part: 0.50
  D2:
    mois: 3
  D3:
    percentile_strate: 95
  E1:
    mois: 12
    min_montant: 40000
  E2:
    min_montant: 90000
  E3:
    exclure_domiciliations: true
  E4: {}
  E5: {}
  E6:
    km: 150
  F1:
    mois: 6
    percentile_strate: 85
  F2:
    percentile_strate: 90
  F3: {}
  G1:
    percentile_bas_strate: 10
  G2:
    champs_obligatoires: [montant, attributaires, procedure, cpv, date_notification]
    confiance_basse_si_part_manquante: 0.30   # au-delà de 30 % de marchés incomplets, les règles dépendantes passent en confiance basse
  G3:
    delai_jours: 60               # [À VÉRIFIER] délai réglementaire de publication des DECP
  G4:
    dedoublonner_sur: [id, acheteur.siret, date_notification]
  H1: {}
  H2: {}
  H3: {}
  I1: {}
  I2:
    part: 0.20
  I3: {}
  I4: {}
